# =============================================================================
# ExternalSecret - Sync API keys from AWS Secrets Manager to K8s
# =============================================================================
#
# This ExternalSecret tells the External Secrets Operator (ESO) to:
# 1. Read the secret from AWS Secrets Manager (a2a-guestbook/api-keys)
# 2. Create a Kubernetes Secret in the guestbook namespace
# 3. Refresh the secret every 1 hour (configurable)
#
# The K8s Secret can then be mounted as environment variables or files
# in the guestbook pods without storing credentials in Git.
#
# SECRET STRUCTURE in AWS Secrets Manager:
#   {
#     "api_keys": ["key1", "key2", ...]
#   }
#
# RESULTING K8s SECRET:
#   data:
#     api_keys: <base64 encoded JSON array>
#
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: guestbook-api-keys
  namespace: guestbook
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/component: secrets
spec:
  # How often to sync the secret (balance between freshness and API costs)
  # 1h = ~720 API calls/month = ~$0.004/month per secret
  refreshInterval: 1h

  # Reference the ClusterSecretStore created by Terraform
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # Target K8s Secret configuration
  target:
    name: guestbook-api-keys
    creationPolicy: Owner # Delete K8s secret when ExternalSecret is deleted
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: guestbook
          app.kubernetes.io/component: secrets

  # Map data from AWS Secrets Manager to K8s Secret keys
  data:
    # Extract the entire secret as JSON
    - secretKey: api_keys
      remoteRef:
        key: a2a-guestbook/api-keys  # Name of secret in Secrets Manager
        property: api_keys            # JSON property to extract
