# ArgoCD Application for External Secrets resources
# Manages ClusterSecretStore and other ESO configuration
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-secrets-config
spec:
  project: default

  source:
    repoURL: https://github.com/rhprasad0/aws-devops-lab
    targetRevision: main
    path: k8s/external-secrets

  destination:
    server: https://kubernetes.default.svc
    # ClusterSecretStore is cluster-scoped, no namespace needed

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true  # Required for CRDs
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
