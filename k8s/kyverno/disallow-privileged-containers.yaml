# =============================================================================
# Kyverno Policy: Disallow Privileged Containers
# =============================================================================
#
# WHY this policy?
# - Privileged containers run with ALL Linux capabilities
# - They can access host devices, modify kernel parameters, escape the container
# - A compromised privileged container = compromised node = compromised cluster
# - This is the single most important container security control
#
# WHAT it does:
# - Blocks containers with privileged: true
# - Blocks containers with allowPrivilegeEscalation: true
# - Ensures hostPID, hostIPC, hostNetwork are not used
#
# WHAT IS privilege escalation?
# - allowPrivilegeEscalation: true lets a process gain MORE privileges than its parent
# - Common attack vector: setuid binaries, kernel exploits
# - Should be false unless you have a very specific reason
#
# EXCEPTIONS:
# - System namespaces (kube-system) are excluded in Kyverno config
# - Some system components (CNI, CSI drivers) legitimately need privileges
#
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged containers have full access to the host and can escape container
      isolation. This policy enforces the baseline Pod Security Standard by
      blocking privileged mode and privilege escalation.
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    # Rule 1: Block privileged: true
    - name: deny-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
                - ReplicaSet
      validate:
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.securityContext.privileged || false }}"
                    operator: Equals
                    value: true
                    message: "Container '{{ element.name }}' has privileged: true. Remove this setting."
          - list: "request.object.spec.initContainers[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.securityContext.privileged || false }}"
                    operator: Equals
                    value: true
                    message: "Init container '{{ element.name }}' has privileged: true."
          - list: "request.object.spec.ephemeralContainers[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.securityContext.privileged || false }}"
                    operator: Equals
                    value: true
                    message: "Ephemeral container has privileged: true."

    # Rule 2: Block allowPrivilegeEscalation: true
    - name: deny-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
                - ReplicaSet
      validate:
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                all:
                  # Block if allowPrivilegeEscalation is explicitly true
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || false }}"
                    operator: Equals
                    value: true
                    message: "Container '{{ element.name }}' has allowPrivilegeEscalation: true. Set it to false."
          - list: "request.object.spec.initContainers[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || false }}"
                    operator: Equals
                    value: true
                    message: "Init container '{{ element.name }}' has allowPrivilegeEscalation: true."
          - list: "request.object.spec.ephemeralContainers[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || false }}"
                    operator: Equals
                    value: true
                    message: "Ephemeral container has allowPrivilegeEscalation: true."

    # Rule 3: Block host namespaces (hostPID, hostIPC, hostNetwork)
    - name: deny-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
                - ReplicaSet
      validate:
        message: >-
          Sharing host namespaces is not allowed. Found hostPID={{ request.object.spec.hostPID || false }},
          hostIPC={{ request.object.spec.hostIPC || false }}, hostNetwork={{ request.object.spec.hostNetwork || false }}.
          These settings break container isolation and allow access to host processes/network.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostPID || false }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostIPC || false }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostNetwork || false }}"
                operator: Equals
                value: true
