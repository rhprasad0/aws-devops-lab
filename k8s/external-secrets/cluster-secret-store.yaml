# =============================================================================
# ClusterSecretStore - AWS Secrets Manager
# =============================================================================
#
# ClusterSecretStore is cluster-wide (vs SecretStore which is namespace-scoped).
# This allows any namespace to create ExternalSecrets that reference this store.
#
# AUTHENTICATION: Uses Pod Identity via the external-secrets ServiceAccount.
# The SA is linked to an IAM role via EKS Pod Identity Association (Terraform).
#
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/managed-by: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No explicit auth - uses Pod Identity via default credentials chain
      # Pod Identity injects AWS_CONTAINER_CREDENTIALS_FULL_URI into pods
